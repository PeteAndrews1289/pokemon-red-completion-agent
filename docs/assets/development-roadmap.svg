<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2033" viewBox="0 0 1420 2033" role="img" aria-labelledby="title description">
<title id="title">Pokemon development roadmap</title>
<desc id="description">7 of 8 current checklist items verified, not overall completion. Eight stages lead from the learning loop to a cross-game registered Pokedex.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3ff}.muted{fill:#adbad1}.eyebrow{font-size:16px;letter-spacing:2px;font-weight:bold}.heading{font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}</style>
<rect width="1420" height="2033" fill="#0b1221"/>
<path d="M1120 0H1420V225Z" fill="#172947"/>
<text x="50" y="55" class="eyebrow" style="fill:#57dfb1">POKEMON / DEVELOPMENT ATLAS</text>
<text x="50" y="125" style="font-size:49px;font-weight:bold">From Red to a registered Pokedex.</text>
<text x="50" y="168" class="body muted">A fixed destination. Evidence-led steps. No hidden finish-line changes.</text>
<text x="50" y="215" class="small">Historical receipt: 135 goal-value examples  /  Fresh-start Red story: verified</text>
<rect x="50" y="260" width="1320" height="556" rx="20" fill="#16243a"/>
<text x="80" y="304" class="eyebrow" style="fill:#ffd36a">YOU ARE HERE / PHASE 05</text>
<text x="80" y="349" class="heading">Frozen fresh completion remains unproved</text>
<text x="80" y="456" style="font-size:88px;font-weight:bold;fill:#ffd36a">88%</text>
<text x="82" y="495" class="body">7 of 8 acceptance items verified</text>
<text x="82" y="529" class="small muted">Checklist only. Not phase completion or a time estimate.</text>
<text x="705" y="326" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="326" class="small">Complete124/124 required entries on the earlier</text>
<text x="778" y="346" class="small">earned reference</text>
<text x="705" y="376" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="376" class="small">Verify same-run Champion/HOF, four legendaries,</text>
<text x="778" y="396" class="small">all originals and649 pins</text>
<text x="705" y="426" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="426" class="small">Retain244 outcomes, model/support attribution,</text>
<text x="778" y="446" class="small">losses/costs and review-ready data</text>
<text x="705" y="476" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="476" class="small">Complete the in-depth retrospective and choose</text>
<text x="778" y="496" class="small">the smallest freeze-readiness work order</text>
<text x="705" y="526" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="526" class="small">Verify shared entry and automatic recovery on</text>
<text x="778" y="546" class="small">two related copies; prepare one immutable</text>
<text x="778" y="566" class="small">attempt</text>
<text x="705" y="596" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="596" class="small">Correct source-only imports and verify the</text>
<text x="778" y="616" class="small">actual fresh entry with existing caches</text>
<text x="705" y="646" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="646" class="small">Qualify the exact first-rival handoff on copies</text>
<text x="778" y="666" class="small">without weakening capture or later-rival checks</text>
<text x="705" y="696" class="small" style="fill:#8594ad">NEXT</text>
<text x="778" y="696" class="small">Complete one unchanged fresh player through</text>
<text x="778" y="716" class="small">Champion/HOF and all124 same-save entries</text>
<rect x="80" y="786" width="1260" height="8" rx="4" fill="#293b55"/>
<rect x="80" y="786" width="1102.5" height="8" rx="4" fill="#ffd36a"/>
<text x="50" y="856" class="eyebrow">THE WHOLE JOURNEY</text>
<text x="740" y="856" class="small" style="fill:#57dfb1">VERIFIED</text>
<text x="870" y="856" class="small" style="fill:#ffd36a">CURRENT</text>
<text x="1000" y="856" class="small" style="fill:#9daac4">PLANNED / NOT DEMONSTRATED</text>
<rect x="50" y="896" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="918" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="927" class="eyebrow" style="fill:#57dfb1">01 / VERIFIED</text>
<text x="74" y="968" class="heading">Build the learning loop</text>
<text x="74" y="1002" class="body">Observe, act, verify, save and learn from actual</text>
<text x="74" y="1026" class="body">outcomes.</text>
<text x="74" y="1051" class="small muted">Teacher and deterministic mechanics support learning; they are not</text>
<text x="74" y="1070" class="small muted">the final player.</text>
<rect x="730" y="896" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="918" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="754" y="927" class="eyebrow" style="fill:#57dfb1">02 / VERIFIED</text>
<text x="754" y="968" class="heading">Make useful Red decisions</text>
<text x="754" y="1002" class="body">Remember failed searches and choose productive</text>
<text x="754" y="1026" class="body">alternatives.</text>
<text x="754" y="1051" class="small muted">Search history must inform learned choices, not a scripted rule</text>
<text x="754" y="1070" class="small muted">forcing another goal.</text>
<rect x="50" y="1121" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1143" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="1152" class="eyebrow" style="fill:#57dfb1">03 / VERIFIED</text>
<text x="74" y="1193" class="heading">Sustain model-directed play</text>
<text x="74" y="1227" class="body">Combine navigation, battles, captures, resources and</text>
<text x="74" y="1251" class="body">recovery.</text>
<text x="74" y="1276" class="small muted">Replace brittle fixed routing with reusable skills; scale battle and</text>
<text x="74" y="1295" class="small muted">navigation authority on evidence.</text>
<rect x="730" y="1121" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1143" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="754" y="1152" class="eyebrow" style="fill:#57dfb1">04 / VERIFIED</text>
<text x="754" y="1193" class="heading">Finish Red with the model</text>
<text x="754" y="1227" class="body">Choose progression from a fresh game through the</text>
<text x="754" y="1251" class="body">Champion.</text>
<text x="754" y="1276" class="small muted">Earlier checkpoint completion is supporting evidence, not this</text>
<text x="754" y="1295" class="small muted">fresh-run gate.</text>
<rect x="50" y="1346" width="640" height="205" rx="14" fill="#202d3d"/>
<rect x="50" y="1368" width="4" height="161" rx="2" fill="#ffd36a"/>
<text x="74" y="1377" class="eyebrow" style="fill:#ffd36a">05 / CURRENT</text>
<text x="74" y="1418" class="heading">Complete Red&#x27;s legitimate native route</text>
<text x="74" y="1452" class="body">Register the declared 124-species Red route in the same</text>
<text x="74" y="1476" class="body">fresh-run save.</text>
<text x="74" y="1501" class="small muted">No cheating or fabricated local flags. Mew and unresolved cable</text>
<text x="74" y="1520" class="small muted">dependencies do not block the ROM-hack gate; no simultaneous living-</text>
<text x="74" y="1539" class="small muted">form quota.</text>
<rect x="730" y="1346" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1368" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="1377" class="eyebrow" style="fill:#9daac4">06 / PLANNED</text>
<text x="754" y="1418" class="heading">Adapt to an unfamiliar Red hack</text>
<text x="754" y="1452" class="body">Test changed encounters, rules or difficulty in a</text>
<text x="754" y="1476" class="body">compatible hack.</text>
<text x="754" y="1501" class="small muted">Compatibility and initial performance are separate tests; deferred</text>
<text x="754" y="1520" class="small muted">species remain explicit shared-ledger gaps.</text>
<rect x="50" y="1571" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1593" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="74" y="1602" class="eyebrow" style="fill:#9daac4">07 / PLANNED</text>
<text x="74" y="1643" class="heading">Transfer and learn Crystal</text>
<text x="74" y="1677" class="body">Reuse shared skills while learning new mechanics and</text>
<text x="74" y="1701" class="body">progression.</text>
<text x="74" y="1726" class="small muted">Add the title adapter, time-dependent encounters, breeding and new</text>
<text x="74" y="1745" class="small muted">mechanics; not another fixed walkthrough.</text>
<rect x="730" y="1571" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1593" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="1602" class="eyebrow" style="fill:#9daac4">08 / PLANNED</text>
<text x="754" y="1643" class="heading">Accumulate a cross-game registered Dex</text>
<text x="754" y="1677" class="body">Continue the shared registered Pokedex through at least</text>
<text x="754" y="1701" class="body">Emerald.</text>
<text x="754" y="1726" class="small muted">Try legitimate linked-version acquisition when practical; otherwise</text>
<text x="754" y="1745" class="small muted">earn deferred species in later games.</text>
<text x="50" y="1855" class="eyebrow" style="fill:#57dfb1">SESSION CHECK-IN</text>
<text x="50" y="1893" class="small muted">2026-10-28-project-audit-publication</text>
<text x="50" y="1928" class="body">Audited scoped successes and repeated support failures. Capture fallback KOs and supplier menu omissions point to existing</text>
<text x="50" y="1953" class="body">execution integration before more fitting.</text>
<text x="50" y="1993" class="small muted">Baseline red-first-v4-legitimate-native / Exit criteria and evidence: docs/development-roadmap.md</text>
</svg>
