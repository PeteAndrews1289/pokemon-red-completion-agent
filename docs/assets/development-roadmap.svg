<text x="74" y="1527" class="eyebrow" style="fill:#57dfb1">01 / VERIFIED</text>
<text x="74" y="1568" class="heading">Build the learning loop</text>
<text x="74" y="1602" class="body">Observe, act, verify, save and learn from actual</text>
<text x="74" y="1626" class="body">outcomes.</text>
<text x="74" y="1651" class="small muted">Teacher and deterministic mechanics support learning; they are not</text>
<text x="74" y="1670" class="small muted">the final player.</text>
<rect x="730" y="1496" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1518" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="754" y="1527" class="eyebrow" style="fill:#57dfb1">02 / VERIFIED</text>
<text x="754" y="1568" class="heading">Make useful Red decisions</text>
<text x="754" y="1602" class="body">Remember failed searches and choose productive</text>
<text x="754" y="1626" class="body">alternatives.</text>
<text x="754" y="1651" class="small muted">Search history must inform learned choices, not a scripted rule</text>
<text x="754" y="1670" class="small muted">forcing another goal.</text>
<rect x="50" y="1721" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1743" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="1752" class="eyebrow" style="fill:#57dfb1">03 / VERIFIED</text>
<text x="74" y="1793" class="heading">Sustain model-directed play</text>
<text x="74" y="1827" class="body">Combine navigation, battles, captures, resources and</text>
<text x="74" y="1851" class="body">recovery.</text>
<text x="74" y="1876" class="small muted">Replace brittle fixed routing with reusable skills; scale battle and</text>
<text x="74" y="1895" class="small muted">navigation authority on evidence.</text>
<rect x="730" y="1721" width="640" height="205" rx="14" fill="#202d3d"/>
<rect x="730" y="1743" width="4" height="161" rx="2" fill="#ffd36a"/>
<text x="754" y="1752" class="eyebrow" style="fill:#ffd36a">04 / CURRENT</text>
<text x="754" y="1793" class="heading">Finish Red with the model</text>
<text x="754" y="1827" class="body">Choose progression from a fresh game through the</text>
<text x="754" y="1851" class="body">Champion.</text>
<text x="754" y="1876" class="small muted">Earlier checkpoint completion is supporting evidence, not this</text>
<text x="754" y="1895" class="small muted">fresh-run gate.</text>
<rect x="50" y="1946" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1968" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="74" y="1977" class="eyebrow" style="fill:#9daac4">05 / PLANNED</text>
<text x="74" y="2018" class="heading">Complete Red&#x27;s legitimate native route</text>
<text x="74" y="2052" class="body">Register the declared 124-species Red route in the same</text>
<text x="74" y="2076" class="body">fresh-run save.</text>
<text x="74" y="2101" class="small muted">No cheating or fabricated local flags. Mew and unresolved cable</text>
<text x="74" y="2120" class="small muted">dependencies do not block the ROM-hack gate; no simultaneous living-</text>
<text x="74" y="2139" class="small muted">form quota.</text>
<rect x="730" y="1946" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1968" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="1977" class="eyebrow" style="fill:#9daac4">06 / PLANNED</text>
<text x="754" y="2018" class="heading">Adapt to an unfamiliar Red hack</text>
<text x="754" y="2052" class="body">Test changed encounters, rules or difficulty in a</text>
<text x="754" y="2076" class="body">compatible hack.</text>
<text x="754" y="2101" class="small muted">Compatibility and initial performance are separate tests; deferred</text>
<text x="754" y="2120" class="small muted">species remain explicit shared-ledger gaps.</text>
<rect x="50" y="2171" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="2193" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="74" y="2202" class="eyebrow" style="fill:#9daac4">07 / PLANNED</text>
<text x="74" y="2243" class="heading">Transfer and learn Crystal</text>
<text x="74" y="2277" class="body">Reuse shared skills while learning new mechanics and</text>
<text x="74" y="2301" class="body">progression.</text>
<text x="74" y="2326" class="small muted">Add the title adapter, time-dependent encounters, breeding and new</text>
<text x="74" y="2345" class="small muted">mechanics; not another fixed walkthrough.</text>
<rect x="730" y="2171" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="2193" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="2202" class="eyebrow" style="fill:#9daac4">08 / PLANNED</text>
<text x="754" y="2243" class="heading">Accumulate a cross-game registered Dex</text>
<text x="754" y="2277" class="body">Continue the shared registered Pokedex through at least</text>
<text x="754" y="2301" class="body">Emerald.</text>
<text x="754" y="2326" class="small muted">Try legitimate linked-version acquisition when practical; otherwise</text>
<text x="754" y="2345" class="small muted">earn deferred species in later games.</text>
<text x="50" y="2455" class="eyebrow" style="fill:#57dfb1">SESSION CHECK-IN</text>
<text x="50" y="2493" class="small muted">open-ended-red-union-f4488e2d661e</text>
<text x="50" y="2528" class="body">All four development saves reached eight badges, the Hall of Fame and 124 registrations. Their first stops shared one</text>
<text x="50" y="2553" class="body">cartridge state. A fifth start reached it again. Two native copy tests verified the repaired poison-blackout handoff. Its</text>
<text x="50" y="2578" class="body">live save paid ₽633 and returned the next goal choice to the model.</text>
<text x="50" y="2618" class="small muted">Baseline red-first-v4-legitimate-native / Exit criteria and evidence: docs/development-roadmap.md</text>
</svg>
