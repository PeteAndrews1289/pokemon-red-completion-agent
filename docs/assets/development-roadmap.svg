<text x="50" y="1456" class="eyebrow">THE WHOLE JOURNEY</text>
<text x="740" y="1456" class="small" style="fill:#57dfb1">VERIFIED</text>
<text x="870" y="1456" class="small" style="fill:#ffd36a">CURRENT</text>
<text x="1000" y="1456" class="small" style="fill:#9daac4">PLANNED / NOT DEMONSTRATED</text>
