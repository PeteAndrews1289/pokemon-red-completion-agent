<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2711" viewBox="0 0 1420 2711" role="img" aria-labelledby="title description">
<title id="title">Pokemon development roadmap</title>
<desc id="description">21 of 22 current checklist items verified, not overall completion. Eight stages lead from the learning loop to a cross-game registered Pokedex.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3ff}.muted{fill:#adbad1}.eyebrow{font-size:16px;letter-spacing:2px;font-weight:bold}.heading{font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}</style>
<rect width="1420" height="2711" fill="#0b1221"/>
<path d="M1120 0H1420V225Z" fill="#172947"/>
<text x="50" y="55" class="eyebrow" style="fill:#57dfb1">POKEMON / DEVELOPMENT ATLAS</text>
<text x="50" y="125" style="font-size:49px;font-weight:bold">From Red to a registered Pokedex.</text>
<text x="50" y="168" class="body muted">A fixed destination. Evidence-led steps. No hidden finish-line changes.</text>
<text x="50" y="215" class="small">119 goal-value examples  /  Fresh-start Red story: not demonstrated</text>
<rect x="50" y="260" width="1320" height="1236" rx="20" fill="#16243a"/>
<text x="80" y="304" class="eyebrow" style="fill:#ffd36a">YOU ARE HERE / PHASE 05</text>
<text x="80" y="349" class="heading">Broaden model-directed Red collection</text>
<text x="80" y="456" style="font-size:88px;font-weight:bold;fill:#ffd36a">95%</text>
<text x="82" y="495" class="body">21 of 22 acceptance items verified</text>
<text x="82" y="529" class="small muted">Checklist only. Not phase completion or a time estimate.</text>
<text x="705" y="326" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="326" class="small">Publish the earned state as a durable fitted-</text>
<text x="778" y="346" class="small">model restart</text>
<text x="705" y="376" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="376" class="small">Build a multi-destination fishing menu without</text>
<text x="778" y="396" class="small">map or species identities</text>
<text x="705" y="426" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="426" class="small">Route, fish and selectively capture from the</text>
<text x="778" y="446" class="small">model&#x27;s chosen destination</text>
<text x="705" y="476" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="476" class="small">Fit the verified fishing outcome without</text>
<text x="778" y="496" class="small">promoting its trust tier</text>
<text x="705" y="526" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="526" class="small">Collect varied destination outcomes from an</text>
<text x="778" y="546" class="small">earned restart, including failure</text>
<text x="705" y="576" class="small" style="fill:#8594ad">NEXT</text>
<text x="778" y="576" class="small">Expose a useful choice across more than one</text>
<text x="778" y="596" class="small">acquisition family</text>
<text x="705" y="626" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="626" class="small">Fit one observed choice from a live menu</text>
<text x="778" y="646" class="small">spanning goal families</text>
<text x="705" y="676" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="676" class="small">Recover capture capacity when the active box is</text>
<text x="778" y="696" class="small">already full</text>
<text x="705" y="726" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="726" class="small">Execute and fit the next model-selected</text>
<text x="778" y="746" class="small">acquisition from the relieved state</text>
<text x="705" y="776" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="776" class="small">Recover the qualified route interruption without</text>
<text x="778" y="796" class="small">a learning label</text>
<text x="705" y="826" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="826" class="small">Derive and bind multiple reachable fishing</text>
<text x="778" y="846" class="small">choices automatically</text>
<text x="705" y="876" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="876" class="small">Retain and fit the automatic runtime&#x27;s actual</text>
<text x="778" y="896" class="small">selected-arm result</text>
<text x="705" y="926" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="926" class="small">Recover the exact model112 terminal and rebuild</text>
<text x="778" y="946" class="small">its next menu</text>
<text x="705" y="976" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="976" class="small">Execute the frozen restore, fit model113 and</text>
<text x="778" y="996" class="small">rebuild a supplemental-only menu</text>
<text x="705" y="1026" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1026" class="small">Execute and fit the frozen fishing acquisition,</text>
<text x="778" y="1046" class="small">then expose the next mixed-goal menu</text>
<text x="705" y="1076" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1076" class="small">Retain and learn the real income result,</text>
<text x="778" y="1096" class="small">including verification failure</text>
<text x="705" y="1126" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1126" class="small">Explain Pay Day exactly and retain the consumed</text>
<text x="778" y="1146" class="small">continuation failure</text>
<text x="705" y="1176" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1176" class="small">Execute and fit Model116&#x27;s exact frozen</text>
<text x="778" y="1196" class="small">acquisition</text>
<text x="705" y="1226" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1226" class="small">Degrade safely when fewer than two fishing</text>
<text x="778" y="1246" class="small">destinations remain</text>
<text x="705" y="1276" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1276" class="small">Execute and fit Model117&#x27;s frozen purchase, then</text>
<text x="778" y="1296" class="small">freeze Model118&#x27;s next choice</text>
<text x="705" y="1326" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1326" class="small">Execute and fit Model118&#x27;s frozen restoration,</text>
<text x="778" y="1346" class="small">then stop honestly at the singleton boundary</text>
<text x="705" y="1376" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="1376" class="small">Execute the sole fishing acquisition without</text>
<text x="778" y="1396" class="small">fabricating learned authority</text>
<rect x="80" y="1466" width="1260" height="8" rx="4" fill="#293b55"/>
<rect x="80" y="1466" width="1202.73" height="8" rx="4" fill="#ffd36a"/>
<text x="50" y="1536" class="eyebrow">THE WHOLE JOURNEY</text>
<text x="740" y="1536" class="small" style="fill:#57dfb1">VERIFIED</text>
<text x="870" y="1536" class="small" style="fill:#ffd36a">CURRENT</text>
<text x="1000" y="1536" class="small" style="fill:#9daac4">PLANNED / NOT DEMONSTRATED</text>
<rect x="50" y="1576" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1598" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="1607" class="eyebrow" style="fill:#57dfb1">01 / VERIFIED</text>
<text x="74" y="1648" class="heading">Build the learning loop</text>
<text x="74" y="1682" class="body">Observe, act, verify, save and learn from actual</text>
<text x="74" y="1706" class="body">outcomes.</text>
<text x="74" y="1731" class="small muted">Teacher and deterministic mechanics support learning; they are not</text>
<text x="74" y="1750" class="small muted">the final player.</text>
<rect x="730" y="1576" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1598" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="754" y="1607" class="eyebrow" style="fill:#57dfb1">02 / VERIFIED</text>
<text x="754" y="1648" class="heading">Make useful Red decisions</text>
<text x="754" y="1682" class="body">Remember failed searches and choose productive</text>
<text x="754" y="1706" class="body">alternatives.</text>
<text x="754" y="1731" class="small muted">Search history must inform learned choices, not a scripted rule</text>
<text x="754" y="1750" class="small muted">forcing another goal.</text>
<rect x="50" y="1801" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1823" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="1832" class="eyebrow" style="fill:#57dfb1">03 / VERIFIED</text>
<text x="74" y="1873" class="heading">Sustain model-directed play</text>
<text x="74" y="1907" class="body">Combine navigation, battles, captures, resources and</text>
<text x="74" y="1931" class="body">recovery.</text>
<text x="74" y="1956" class="small muted">Replace brittle fixed routing with reusable skills; scale battle and</text>
<text x="74" y="1975" class="small muted">navigation authority on evidence.</text>
<rect x="730" y="1801" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1823" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="1832" class="eyebrow" style="fill:#9daac4">04 / PLANNED</text>
<text x="754" y="1873" class="heading">Finish Red with the model</text>
<text x="754" y="1907" class="body">Choose progression from a fresh game through the</text>
<text x="754" y="1931" class="body">Champion.</text>
<text x="754" y="1956" class="small muted">Earlier checkpoint completion is supporting evidence, not this</text>
<text x="754" y="1975" class="small muted">fresh-run gate.</text>
<rect x="50" y="2026" width="640" height="205" rx="14" fill="#202d3d"/>
<rect x="50" y="2048" width="4" height="161" rx="2" fill="#ffd36a"/>
<text x="74" y="2057" class="eyebrow" style="fill:#ffd36a">05 / CURRENT</text>
<text x="74" y="2098" class="heading">Complete the full Red Pokedex</text>
<text x="74" y="2132" class="body">Register every Red Pokedex entry in the same fresh-run</text>
<text x="74" y="2156" class="body">save.</text>
<text x="74" y="2181" class="small muted">No reduced availability subset. Shared credit is not a local flag;</text>
<text x="74" y="2200" class="small muted">no living-form quota.</text>
<rect x="730" y="2026" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="2048" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="2057" class="eyebrow" style="fill:#9daac4">06 / PLANNED</text>
<text x="754" y="2098" class="heading">Adapt to an unfamiliar Red hack</text>
<text x="754" y="2132" class="body">Test changed encounters, rules or difficulty in a</text>
<text x="754" y="2156" class="body">compatible hack.</text>
<text x="754" y="2181" class="small muted">Blocked until complete Red. Compatibility and initial performance</text>
<text x="754" y="2200" class="small muted">are separate tests.</text>
<rect x="50" y="2251" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="2273" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="74" y="2282" class="eyebrow" style="fill:#9daac4">07 / PLANNED</text>
<text x="74" y="2323" class="heading">Transfer and learn Crystal</text>
<text x="74" y="2357" class="body">Reuse shared skills while learning new mechanics and</text>
<text x="74" y="2381" class="body">progression.</text>
<text x="74" y="2406" class="small muted">Add the title adapter, time-dependent encounters, breeding and new</text>
<text x="74" y="2425" class="small muted">mechanics; not another fixed walkthrough.</text>
<rect x="730" y="2251" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="2273" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="2282" class="eyebrow" style="fill:#9daac4">08 / PLANNED</text>
<text x="754" y="2323" class="heading">Accumulate a cross-game registered Dex</text>
<text x="754" y="2357" class="body">Continue the shared registered Pokedex through at least</text>
<text x="754" y="2381" class="body">Emerald.</text>
<text x="754" y="2406" class="small muted">Learn new generation mechanics; retain truthful global, local and</text>
<text x="754" y="2425" class="small muted">physical views.</text>
<text x="50" y="2535" class="eyebrow" style="fill:#57dfb1">SESSION CHECK-IN</text>
<text x="50" y="2573" class="small muted">2026-09-13-model119-forced-singleton-fishing</text>
<text x="50" y="2608" class="body">The sole fishing acquisition executed once under forced-singleton authority and captured national species061 in905</text>
<text x="50" y="2633" class="body">actions/45,564 frames. Collection advanced to86 registrations/66 living species/70 specimens; Model119 stayed119 examples/81</text>
<text x="50" y="2658" class="body">successes with zero model queries, teacher labels or training examples.</text>
<text x="50" y="2671" class="small muted">Baseline red-first-v3-full-run / Exit criteria and evidence: docs/development-roadmap.md</text>
</svg>
