<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1870" viewBox="0 0 1420 1870" role="img" aria-labelledby="title description">
<title id="title">Pokemon development roadmap</title>
<desc id="description">9 of 10 current checklist items verified, not overall completion. Eight stages lead from the learning loop to a cross-game registered Pokedex.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3ff}.muted{fill:#adbad1}.eyebrow{font-size:16px;letter-spacing:2px;font-weight:bold}.heading{font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}</style>
<rect width="1420" height="1870" fill="#0b1221"/>
<path d="M1120 0H1420V225Z" fill="#172947"/>
<text x="50" y="55" class="eyebrow" style="fill:#57dfb1">POKEMON / DEVELOPMENT ATLAS</text>
<text x="50" y="125" style="font-size:49px;font-weight:bold">From Red to a registered Pokedex.</text>
<text x="50" y="168" class="body muted">A fixed destination. Evidence-led steps. No hidden finish-line changes.</text>
<text x="50" y="215" class="small">111 goal-value examples  /  Checkpoint-based Red story: verified</text>
<rect x="50" y="260" width="1320" height="395" rx="20" fill="#16243a"/>
<text x="80" y="304" class="eyebrow" style="fill:#ffd36a">YOU ARE HERE / PHASE 05</text>
<text x="80" y="349" class="heading">Broaden model-directed Red collection</text>
<text x="80" y="456" style="font-size:88px;font-weight:bold;fill:#ffd36a">90%</text>
<text x="82" y="495" class="body">9 of 10 acceptance items verified</text>
<text x="82" y="529" class="small muted">Checklist only. Not phase completion or a time estimate.</text>
<text x="705" y="326" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="326" class="small">Publish the earned state as a durable fitted-model restart</text>
<text x="705" y="356" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="356" class="small">Build a multi-destination fishing menu without map or species identities</text>
<text x="705" y="386" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="386" class="small">Route, fish and selectively capture from the model&#x27;s chosen destination</text>
<text x="705" y="416" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="416" class="small">Fit the verified fishing outcome without promoting its trust tier</text>
<text x="705" y="446" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="446" class="small">Collect varied destination outcomes from an earned restart, including failure</text>
<text x="705" y="476" class="small" style="fill:#8594ad">NEXT</text>
<text x="778" y="476" class="small">Expose a useful choice across more than one acquisition family</text>
<text x="705" y="506" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="506" class="small">Fit one observed choice from a live menu spanning goal families</text>
<text x="705" y="536" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="536" class="small">Recover capture capacity when the active box is already full</text>
<text x="705" y="566" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="566" class="small">Execute and fit the next model-selected acquisition from the relieved state</text>
<text x="705" y="596" class="small" style="fill:#57dfb1">DONE</text>
<text x="778" y="596" class="small">Recover the qualified route interruption without a learning label</text>
<rect x="80" y="625" width="1260" height="8" rx="4" fill="#293b55"/>
<rect x="80" y="625" width="1134" height="8" rx="4" fill="#ffd36a"/>
<text x="50" y="695" class="eyebrow">THE WHOLE JOURNEY</text>
<text x="740" y="695" class="small" style="fill:#57dfb1">VERIFIED</text>
<text x="870" y="695" class="small" style="fill:#ffd36a">CURRENT</text>
<text x="1000" y="695" class="small" style="fill:#9daac4">PLANNED / NOT DEMONSTRATED</text>
<rect x="50" y="735" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="757" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="766" class="eyebrow" style="fill:#57dfb1">01 / VERIFIED</text>
<text x="74" y="807" class="heading">Build the learning loop</text>
<text x="74" y="841" class="body">Observe, act, verify, save and learn from actual</text>
<text x="74" y="865" class="body">outcomes.</text>
<text x="74" y="890" class="small muted">Teacher and deterministic mechanics support learning; they are not</text>
<text x="74" y="909" class="small muted">the final player.</text>
<rect x="730" y="735" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="757" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="754" y="766" class="eyebrow" style="fill:#57dfb1">02 / VERIFIED</text>
<text x="754" y="807" class="heading">Make useful Red decisions</text>
<text x="754" y="841" class="body">Remember failed searches and choose productive</text>
<text x="754" y="865" class="body">alternatives.</text>
<text x="754" y="890" class="small muted">Search history must inform learned choices, not a scripted rule</text>
<text x="754" y="909" class="small muted">forcing another goal.</text>
<rect x="50" y="960" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="982" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="74" y="991" class="eyebrow" style="fill:#57dfb1">03 / VERIFIED</text>
<text x="74" y="1032" class="heading">Sustain model-directed play</text>
<text x="74" y="1066" class="body">Combine navigation, battles, captures, resources and</text>
<text x="74" y="1090" class="body">recovery.</text>
<text x="74" y="1115" class="small muted">Replace brittle fixed routing with reusable skills; scale battle and</text>
<text x="74" y="1134" class="small muted">navigation authority on evidence.</text>
<rect x="730" y="960" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="982" width="4" height="161" rx="2" fill="#57dfb1"/>
<text x="754" y="991" class="eyebrow" style="fill:#57dfb1">04 / VERIFIED</text>
<text x="754" y="1032" class="heading">Finish Red with the model</text>
<text x="754" y="1066" class="body">Plan quests, prerequisites and puzzles through the</text>
<text x="754" y="1090" class="body">Champion.</text>
<text x="754" y="1115" class="small muted">Teacher completion already exists. It does not satisfy this learned-</text>
<text x="754" y="1134" class="small muted">player milestone.</text>
<rect x="50" y="1185" width="640" height="205" rx="14" fill="#202d3d"/>
<rect x="50" y="1207" width="4" height="161" rx="2" fill="#ffd36a"/>
<text x="74" y="1216" class="eyebrow" style="fill:#ffd36a">05 / CURRENT</text>
<text x="74" y="1257" class="heading">Build the shared registered Dex</text>
<text x="74" y="1291" class="body">Catch, evolve and record missing species; deposit</text>
<text x="74" y="1315" class="body">completed lines and skip already-credited work.</text>
<text x="74" y="1340" class="small muted">No level100 or living-form quota. Global credit, local Pokedex flags</text>
<text x="74" y="1359" class="small muted">and physical stock stay separate; external dependencies remain</text>
<text x="74" y="1378" class="small muted">explicit.</text>
<rect x="730" y="1185" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1207" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="1216" class="eyebrow" style="fill:#9daac4">06 / PLANNED</text>
<text x="754" y="1257" class="heading">Adapt to an unfamiliar Red hack</text>
<text x="754" y="1291" class="body">Test changed encounters, rules or difficulty in a</text>
<text x="754" y="1315" class="body">compatible hack.</text>
<text x="754" y="1340" class="small muted">Compatibility is checked separately. Red competence does not</text>
<text x="754" y="1359" class="small muted">guarantee an immediate win.</text>
<rect x="50" y="1410" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="50" y="1432" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="74" y="1441" class="eyebrow" style="fill:#9daac4">07 / PLANNED</text>
<text x="74" y="1482" class="heading">Transfer and learn Crystal</text>
<text x="74" y="1516" class="body">Reuse shared skills while learning new mechanics and</text>
<text x="74" y="1540" class="body">progression.</text>
<text x="74" y="1565" class="small muted">Add the title adapter, time-dependent encounters, breeding and new</text>
<text x="74" y="1584" class="small muted">mechanics; not another fixed walkthrough.</text>
<rect x="730" y="1410" width="640" height="205" rx="14" fill="#111e31"/>
<rect x="730" y="1432" width="4" height="161" rx="2" fill="#9daac4"/>
<text x="754" y="1441" class="eyebrow" style="fill:#9daac4">08 / PLANNED</text>
<text x="754" y="1482" class="heading">Accumulate a cross-game registered Dex</text>
<text x="754" y="1516" class="body">Reuse competence and verified registration while pursuing</text>
<text x="754" y="1540" class="body">new gaps in later games.</text>
<text x="754" y="1565" class="small muted">Already-credited lines need no redundant grind unless useful for the</text>
<text x="754" y="1584" class="small muted">current run or a new dependency.</text>
<text x="50" y="1694" class="eyebrow" style="fill:#57dfb1">SESSION CHECK-IN</text>
<text x="50" y="1732" class="small muted">2026-09-12-model111-zero-label-recovery</text>
<text x="50" y="1767" class="body">The exact model111 terminal recovered input-ready field control in8actions/576frames and reopened as zero-label support</text>
<text x="50" y="1792" class="body">with83registrations. The action-free next menu was forced-only restore_team; no choice or fit occurred. The roadmap advances</text>
<text x="50" y="1817" class="body">to9/10.</text>
<text x="50" y="1830" class="small muted">Baseline red-first-v2-registered / Exit criteria and evidence: docs/development-roadmap.md</text>
</svg>
