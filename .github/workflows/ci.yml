name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,emulator]"
      - run: python scripts/check_public_artifacts.py
      - run: python scripts/check_docs.py
      - run: python scripts/regenerate_collection_registry.py --check
      - run: ruff check .
      - run: python -m mypy
      # Keep a file's shared fixtures on one worker. Coverage is unchanged;
      # two processes remove the serial bottleneck without oversubscribing BLAS.
      - run: pytest -n 2 --dist loadfile --max-worker-restart 0 --maxfail=1 --durations=20 -m "not integration"
