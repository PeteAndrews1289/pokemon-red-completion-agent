name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,emulator]"
      - run: python scripts/check_public_artifacts.py
      - run: python scripts/check_docs.py
      - run: python scripts/regenerate_collection_registry.py --check
      - run: ruff check .
      - run: python -m mypy
      - run: pytest -m "not integration"
